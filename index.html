<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Race Weekend F1 Archive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #14171d;
      --card-bg: #1e232d;
      --btn-bg: #292f3d;
      --btn-active: #333b4d;
      --accent: #e10600;
      --text: #ffffff;
      --text-muted: #8e95a5;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .view { display: none; }
    .view.active { display: block; }

    .search-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      box-sizing: border-box;
      margin-bottom: 14px;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-muted); }

    .bot-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      line-height: 1.5;
    }
    .bot-card h2 { margin: 0 0 8px 0; font-size: 16px; text-transform: uppercase; }

    .welcome-banner {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      display: none;
    }

    .menu-btn {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text);
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-sizing: border-box;
      text-align: left;
    }
    .menu-btn:active { background: var(--btn-active); }

    .menu-btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }
    .menu-btn-thumb {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      background: #252a36;
      flex-shrink: 0;
    }

    .admin-entry-btn {
      background: rgba(225, 6, 0, 0.15);
      border: 1px solid var(--accent);
      color: #ff6b6b;
      margin-top: 20px;
      padding: 15px 16px;
    }

    .search-result-item { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .search-result-sub { font-size: 12px; color: var(--text-muted); font-weight: normal; }

    .gp-banner {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 14px;
      background: #252a36;
    }
    .gp-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
    .gp-desc { font-size: 13.5px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.45; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(225, 6, 0, 0.15);
      color: #ff5555;
      flex-shrink: 0;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      padding: 0;
      cursor: pointer;
    }

    .admin-input-group { margin-bottom: 14px; }
    .admin-input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .admin-input-group small { display: block; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .admin-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      box-sizing: border-box;
      outline: none;
    }
    .admin-input:focus { border-color: var(--accent); }
    .submit-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .stats-card {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-number { font-size: 20px; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }
    .skeleton { text-align: center; padding: 40px 0; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ГЛАВНАЯ И ПОИСК -->
  <div id="view-home" class="view active">
    <input 
      type="text" 
      id="search-input" 
      class="search-box" 
      placeholder="🔍 Поиск по гонкам и сериалам..." 
      oninput="handleSearch(this.value)"
    >

    <div id="home-default-content">
      <!-- Настраиваемая приветственная карточка -->
      <div class="bot-card" id="welcome-card" style="display: none;">
        <img id="welcome-img" class="welcome-banner" src="" alt="Banner">
        <h2 id="welcome-title"></h2>
        <div id="welcome-text"></div>
      </div>

      <div id="categories-list">
        <div class="skeleton">Синхронизация каталога D1...</div>
      </div>

      <div id="admin-entry-container" style="display: none;">
        <button class="menu-btn admin-entry-btn" onclick="openAdminPanel()">
          <span>⚙️ Панель администратора</span>
          <span>›</span>
        </button>
      </div>
    </div>

    <div id="search-results-list" style="display: none;"></div>
  </div>

  <!-- ЭКРАН 2: ЭТАПЫ / СЕЗОНЫ -->
  <div id="view-titles" class="view">
    <button class="back-btn" onclick="showView('home')">← Главное меню</button>
    <div id="titles-list"></div>
  </div>

  <!-- ЭКРАН 3: КАРТОЧКА ЗАЕЗДОВ -->
  <div id="view-details" class="view">
    <button class="back-btn" onclick="backFromDetails()">← Назад к списку</button>
    <div id="item-header"></div>
    <div id="item-btns"></div>
  </div>

  <!-- ЭКРАН 4: ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <div id="view-admin" class="view">
    <button class="back-btn" onclick="showView('home')">← Вернуться в архив</button>
    
    <!-- Статистика -->
    <div class="stats-card">
      <div class="stat-item">
        <div id="stat-users" class="stat-number">...</div>
        <div class="stat-label">Подписчиков</div>
      </div>
      <div class="stat-item">
        <div id="stat-active" class="stat-number">...</div>
        <div class="stat-label">За 24 часа</div>
      </div>
      <div class="stat-item">
        <div id="stat-items" class="stat-number">...</div>
        <div class="stat-label">В архиве</div>
      </div>
    </div>

    <!-- Редактор приветственного блока -->
    <div class="bot-card">
      <h2 style="color: var(--accent);">🎨 Настройка главного меню</h2>
      
      <div class="admin-input-group">
        <label>Заголовок приветствия</label>
        <input class="admin-input" id="set-welcome-title" placeholder="📌 RACE WEEKEND F1 ARCHIVE">
        <small>Оставь пустым, если не нужен заголовок.</small>
      </div>

      <div class="admin-input-group">
        <label>Текст описания</label>
        <textarea class="admin-input" id="set-welcome-text" rows="2" placeholder="Текст под заголовком..."></textarea>
      </div>

      <div class="admin-input-group">
        <label>Баннер главного экрана (URL картинки)</label>
        <input class="admin-input" id="set-welcome-img" placeholder="https://i.postimg.cc/... (или пусто)">
      </div>

      <button class="submit-btn" style="background:#292f3d; border:1px solid rgba(255,255,255,0.15);" onclick="saveSettings()">💾 Сохранить оформление</button>
    </div>

    <!-- Добавление записи -->
    <div class="bot-card">
      <h2 style="color: var(--accent);">➕ Добавить запись в каталог</h2>
      
      <div class="admin-input-group">
        <label>Категория</label>
        <input class="admin-input" id="adm-cat" placeholder="🔴Сезон 2026 или 🎥Гонять чтобы выживать">
      </div>

      <div class="admin-input-group">
        <label>Название события / Сезон</label>
        <input class="admin-input" id="adm-title" placeholder="🇧🇪 Гран При Бельгии 2026 или Сезон 1">
      </div>

      <div class="admin-input-group">
        <label>Ссылка на постер (URL картинки)</label>
        <input class="admin-input" id="adm-img" placeholder="https://i.postimg.cc/...">
        <small>Отображается в карточке и как превью в списке.</small>
      </div>

      <div class="admin-input-group">
        <label>Описание</label>
        <textarea class="admin-input" id="adm-desc" rows="2" placeholder="Краткое описание этапа..."></textarea>
      </div>

      <div class="admin-input-group">
        <label>Название сессии / серии</label>
        <input class="admin-input" id="adm-item" placeholder="Гонка, Квалификация или 1 Серия">
      </div>

      <div class="admin-input-group">
        <label>Бейдж качества</label>
        <input class="admin-input" id="adm-badge" value="1080p">
      </div>

      <div class="admin-input-group">
        <label>Код выдачи (латиница без пробелов)</label>
        <input class="admin-input" id="adm-code" placeholder="belgium26_r">
      </div>

      <div class="admin-input-group">
        <label>ID сообщения на складе</label>
        <input type="number" class="admin-input" id="adm-post" placeholder="Например: 105">
      </div>

      <button class="submit-btn" onclick="submitNewItem()">💾 Сохранить в D1</button>
    </div>

    <!-- Рассылка -->
    <div class="bot-card">
      <h2>📢 Рассылка подписчикам</h2>
      <div class="admin-input-group">
        <textarea class="admin-input" id="broadcast-msg" rows="3" placeholder="Текст рассылки (HTML)..."></textarea>
      </div>
      <button class="submit-btn" style="background:#292f3d; border:1px solid rgba(255,255,255,0.2);" onclick="sendBroadcast()">🚀 Запустить рассылку</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const WORKER_URL = "https://dark-art-1fac.poiuyuiop132.workers.dev";
    const BOT_USERNAME = "race_weekend_f1_bot";
    const ADMIN_ID = "301211351";

    let dataTree = {};
    let allItemsFlat = [];
    let activeCategory = null;
    let cameFromSearch = false;

    const currentUserId = tg.initDataUnsafe?.user?.id;
    if (String(currentUserId) === String(ADMIN_ID)) {
      document.getElementById('admin-entry-container').style.display = 'block';
    }

    function showView(name) {
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      window.scrollTo(0, 0);
    }

    function backFromDetails() {
      cameFromSearch ? showView('home') : showView('titles');
    }

    // Загрузка настроек приветственного экрана
    function loadSettings() {
      fetch(`${WORKER_URL}/api/settings`)
        .then(r => r.json())
        .then(data => {
          const card = document.getElementById('welcome-card');
          const title = document.getElementById('welcome-title');
          const text = document.getElementById('welcome-text');
          const img = document.getElementById('welcome-img');

          const hasTitle = data.welcome_title && data.welcome_title.trim();
          const hasText = data.welcome_text && data.welcome_text.trim();
          const hasImg = data.welcome_image && data.welcome_image.trim();

          if (!hasTitle && !hasText && !hasImg) {
            card.style.display = 'none';
          } else {
            card.style.display = 'block';
            title.innerText = hasTitle ? data.welcome_title : '';
            title.style.display = hasTitle ? 'block' : 'none';

            text.innerText = hasText ? data.welcome_text : '';
            text.style.display = hasText ? 'block' : 'none';

            if (hasImg) {
              img.src = data.welcome_image;
              img.style.display = 'block';
            } else {
              img.style.display = 'none';
            }
          }

          // Предзаполнение полей в админке
          if (document.getElementById('set-welcome-title')) {
            document.getElementById('set-welcome-title').value = data.welcome_title || '';
            document.getElementById('set-welcome-text').value = data.welcome_text || '';
            document.getElementById('set-welcome-img').value = data.welcome_image || '';
          }
        })
        .catch(() => {});
    }

    // Загрузка каталога
    function loadCatalog() {
      fetch(`${WORKER_URL}/api/catalog`)
        .then(r => r.json())
        .then(rows => {
          dataTree = {};
          allItemsFlat = [];

          rows.forEach(entry => {
            const cat = entry.category || 'Разное';
            const t = entry.title;

            if (!dataTree[cat]) dataTree[cat] = {};
            if (!dataTree[cat][t]) {
              dataTree[cat][t] = { 
                image: entry.image, 
                description: entry.description, 
                items: [] 
              };
            }
            if (!dataTree[cat][t].image && entry.image) dataTree[cat][t].image = entry.image;
            if (!dataTree[cat][t].description && entry.description) dataTree[cat][t].description = entry.description;

            dataTree[cat][t].items.push({ 
              item: entry.item, 
              badge: entry.badge, 
              code: entry.code 
            });

            allItemsFlat.push(entry);
          });

          // Отрисовка категорий на главной
          const container = document.getElementById('categories-list');
          container.innerHTML = '';
          for (const cat in dataTree) {
            const btn = document.createElement('div');
            btn.className = 'menu-btn';
            btn.innerHTML = `
              <div class="menu-btn-content">
                <span>${cat}</span>
              </div>
              <span style="opacity:0.4;">›</span>
            `;
            btn.onclick = () => openCategory(cat);
            container.appendChild(btn);
          }
        })
        .catch(() => {
          document.getElementById('categories-list').innerHTML = 
            '<div class="skeleton">Ошибка загрузки базы Cloudflare.</div>';
        });
    }

    loadSettings();
    loadCatalog();

    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      const defaultContent = document.getElementById('home-default-content');
      const searchContainer = document.getElementById('search-results-list');

      if (!q) {
        defaultContent.style.display = 'block';
        searchContainer.style.display = 'none';
        searchContainer.innerHTML = '';
        return;
      }

      defaultContent.style.display = 'none';
      searchContainer.style.display = 'block';
      searchContainer.innerHTML = '';

      const matched = allItemsFlat.filter(entry => 
        entry.title.toLowerCase().includes(q) || 
        entry.item.toLowerCase().includes(q) ||
        entry.category.toLowerCase().includes(q)
      );

      if (matched.length === 0) {
        searchContainer.innerHTML = '<div class="skeleton">Ничего не найдено 🏎</div>';
        return;
      }

      matched.forEach(entry => {
        const btn = document.createElement('div');
        btn.className = 'menu-btn';
        const thumbHtml = entry.image ? `<img class="menu-btn-thumb" src="${entry.image}">` : '';

        btn.innerHTML = `
          <div class="menu-btn-content">
            ${thumbHtml}
            <div class="search-result-item">
              <span>${entry.title} — ${entry.item}</span>
              <span class="search-result-sub">${entry.category}</span>
            </div>
          </div>
          <span class="badge">${entry.badge || 'HD'}</span>
        `;
        btn.onclick = () => {
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=${entry.code}`);
          tg.close();
        };
        searchContainer.appendChild(btn);
      });
    }

    function openCategory(cat) {
      activeCategory = cat;
      cameFromSearch = false;
      const container = document.getElementById('titles-list');
      container.innerHTML = '';

      for (const t in dataTree[cat]) {
        const itemData = dataTree[cat][t];
        const btn = document.createElement('div');
        btn.className = 'menu-btn';

        const thumbHtml = itemData.image 
          ? `<img class="menu-btn-thumb" src="${itemData.image}">` 
          : '';

        btn.innerHTML = `
          <div class="menu-btn-content">
            ${thumbHtml}
            <span>${t}</span>
          </div>
          <span style="opacity:0.4;">›</span>
        `;
        btn.onclick = () => openDetails(t);
        container.appendChild(btn);
      }
      showView('titles');
    }

    function openDetails(titleKey) {
      const data = dataTree[activeCategory][titleKey];
      const headerBox = document.getElementById('item-header');
      const btnsBox = document.getElementById('item-btns');

      let bannerHtml = (data.image && data.image.startsWith('http')) 
        ? `<img class="gp-banner" src="${data.image}" alt="${titleKey}">` 
        : '';
      let descHtml = data.description 
        ? `<div class="gp-desc">${data.description}</div>` 
        : '';

      headerBox.innerHTML = `
        ${bannerHtml}
        <div class="gp-title">${titleKey}</div>
        ${descHtml}
      `;

      btnsBox.innerHTML = '';
      data.items.forEach(it => {
        const btn = document.createElement('div');
        btn.className = 'menu-btn';
        btn.innerHTML = `
          <div class="menu-btn-content">
            <span>${it.item}</span>
          </div>
          <span class="badge">${it.badge || 'HD'}</span>
        `;
        btn.onclick = () => {
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=${it.code}`);
          tg.close();
        };
        btnsBox.appendChild(btn);
      });

      showView('details');
    }

    function openAdminPanel() {
      showView('admin');
      fetch(`${WORKER_URL}/api/stats`, {
        headers: { 'X-Admin-Id': currentUserId }
      })
      .then(r => r.json())
      .then(data => {
        document.getElementById('stat-users').innerText = data.total_users;
        document.getElementById('stat-active').innerText = data.active_24h;
        document.getElementById('stat-items').innerText = data.total_items;
      });
      loadSettings();
    }

    // Сохранение настроек экрана приветствия
    function saveSettings() {
      const payload = {
        welcome_title: document.getElementById('set-welcome-title').value,
        welcome_text: document.getElementById('set-welcome-text').value,
        welcome_image: document.getElementById('set-welcome-img').value
      };

      fetch(`${WORKER_URL}/api/settings/update`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Id': currentUserId
        },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          alert('✅ Оформление главного экрана сохранено!');
          loadSettings();
        } else {
          alert('Ошибка сохранения');
        }
      });
    }

    function submitNewItem() {
      const payload = {
        category: document.getElementById('adm-cat').value,
        title: document.getElementById('adm-title').value,
        image: document.getElementById('adm-img').value,
        description: document.getElementById('adm-desc').value,
        item: document.getElementById('adm-item').value,
        badge: document.getElementById('adm-badge').value,
        code: document.getElementById('adm-code').value,
        post_id: document.getElementById('adm-post').value,
      };

      if (!payload.category || !payload.title || !payload.item || !payload.code || !payload.post_id) {
        alert('Заполните обязательные поля (Категория, Название, Сессия, Код, Post ID)!');
        return;
      }

      fetch(`${WORKER_URL}/api/catalog/add`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Id': currentUserId
        },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          alert('✅ Успешно сохранено в базу D1!');
          document.getElementById('adm-item').value = '';
          document.getElementById('adm-code').value = '';
          document.getElementById('adm-post').value = '';
          loadCatalog();
        } else {
          alert('Ошибка сохранения: ' + res.error);
        }
      });
    }

    function sendBroadcast() {
      const msg = document.getElementById('broadcast-msg').value.trim();
      if (!msg) return alert('Введите текст сообщения!');
      if (!confirm('Отправить сообщение всем подписчикам?')) return;

      fetch(`${WORKER_URL}/api/broadcast`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Id': currentUserId
        },
        body: JSON.stringify({ message: msg })
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          alert(`✅ Рассылка завершена! Отправлено: ${res.sent}`);
          document.getElementById('broadcast-msg').value = '';
        } else {
          alert('Ошибка рассылки');
        }
      });
    }
  </script>
</body>
</html>
