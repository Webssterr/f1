<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Race Weekend F1 Archive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #14171d;
      --card-bg: #1e232d;
      --btn-bg: #292f3d;
      --btn-active: #333b4d;
      --accent: #e10600;
      --text: #ffffff;
      --text-muted: #8e95a5;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* Поле поиска */
    .search-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      box-sizing: border-box;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent);
    }
    .search-box::placeholder {
      color: var(--text-muted);
    }

    /* Главная карточка-описание */
    .bot-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      line-height: 1.5;
    }
    .bot-card h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bot-card ul {
      margin: 8px 0;
      padding-left: 18px;
      color: var(--text-muted);
    }

    /* Кнопки меню */
    .menu-btn {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text);
      padding: 15px 16px;
      margin-bottom: 10px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.15s ease;
    }
    .menu-btn:active { background: var(--btn-active); transform: scale(0.99); }

    /* Карточка результата поиска */
    .search-result-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }
    .search-result-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: normal;
    }

    /* Постер и инфо карточки */
    .gp-banner {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 14px;
      background: #252a36;
    }
    .gp-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .gp-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.45;
      font-style: italic;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(225, 6, 0, 0.15);
      color: #ff5555;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .skeleton { text-align: center; padding: 40px 0; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ И ПОИСК -->
  <div id="view-home" class="view active">
    <!-- Поле живого поиска -->
    <input 
      type="text" 
      id="search-input" 
      class="search-box" 
      placeholder="🔍 Поиск по гонкам и сериалам..." 
      oninput="handleSearch(this.value)"
    >

    <!-- Блок категорий (скрывается во время поиска) -->
    <div id="home-default-content">
      <div class="bot-card">
        <h2>📌 Race Weekend F1 Archive</h2>
        <div>Весь наш архив гонок, сериалов и прочего разложенный по полочкам.</div>
        <ul>
          <li>Без цензуры и банов (все полные записи тут).</li>
          <li>Максимально возможное качество картинки для Telegram.</li>
        </ul>
        <div style="color: var(--text-muted); font-size: 12px; margin-top: 6px;">
          База обновляется после каждого Гран-при.
        </div>
      </div>
      <div id="categories-list">
        <div class="skeleton">Синхронизация каталога...</div>
      </div>
    </div>

    <!-- Блок результатов поиска -->
    <div id="search-results-list" style="display: none;"></div>
  </div>

  <!-- ЭКРАН 2: ЭТАПЫ / СЕЗОНЫ СЕРИАЛА -->
  <div id="view-titles" class="view">
    <button class="back-btn" onclick="showView('home')">← Главное меню</button>
    <div id="titles-list"></div>
  </div>

  <!-- ЭКРАН 3: КАРТОЧКА С ПОСТЕРОМ И ВЫДАЧЕЙ -->
  <div id="view-details" class="view">
    <button class="back-btn" onclick="backFromDetails()">← Назад к списку</button>
    <div id="item-header"></div>
    <div id="item-btns"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // НАСТРОЙКИ:
    const SHEET_ID = "1-3OM9Wu1k6lrVb1HGK2I5vaRNgA4gYMP6J42s74z3No";
    const BOT_USERNAME = "race_weekend_f1_bot";

    const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    let dataTree = {};
    let allItemsFlat = []; // Плоский список для быстрого поиска
    let activeCategory = null;
    let cameFromSearch = false;

    function showView(name) {
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      window.scrollTo(0, 0);
    }

    function backFromDetails() {
      if (cameFromSearch) {
        showView('home');
      } else {
        showView('titles');
      }
    }

    fetch(csvUrl)
      .then(r => r.text())
      .then(csvText => {
        const rows = csvText.split('\n').slice(1);
        dataTree = {};
        allItemsFlat = [];

        rows.forEach(row => {
          if (!row.trim()) return;
          const cols = row.split('","').map(c => c.replace(/"/g, '').trim());

          const category = cols[0] || 'Разное';
          const title = cols[1];
          const img = cols[2];
          const desc = cols[3];
          const item = cols[4];
          const badge = cols[5];
          const code = cols[6];

          if (title && item && code) {
            // Структурируем в дерево категорий
            if (!dataTree[category]) dataTree[category] = {};
            if (!dataTree[category][title]) {
              dataTree[category][title] = { image: img, description: desc, items: [] };
            }
            if (!dataTree[category][title].image && img) dataTree[category][title].image = img;
            if (!dataTree[category][title].description && desc) dataTree[category][title].description = desc;

            dataTree[category][title].items.push({ item, badge, code });

            // Сохраняем для быстрого поиска
            allItemsFlat.push({
              category,
              title,
              item,
              badge,
              code
            });
          }
        });

        // Отрисовка категорий на главном экране
        const container = document.getElementById('categories-list');
        container.innerHTML = '';

        for (const cat in dataTree) {
          const btn = document.createElement('div');
          btn.className = 'menu-btn';
          btn.innerHTML = `<span>${cat}</span><span style="opacity:0.4;">›</span>`;
          btn.onclick = () => openCategory(cat);
          container.appendChild(btn);
        }
      })
      .catch(() => {
        document.getElementById('categories-list').innerHTML = 
          '<div class="skeleton">Ошибка загрузки базы данных.</div>';
      });

    // Обработка живого ввода в строке поиска
    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      const defaultContent = document.getElementById('home-default-content');
      const searchContainer = document.getElementById('search-results-list');

      if (!q) {
        defaultContent.style.display = 'block';
        searchContainer.style.display = 'none';
        searchContainer.innerHTML = '';
        return;
      }

      defaultContent.style.display = 'none';
      searchContainer.style.display = 'block';
      searchContainer.innerHTML = '';

      const matched = allItemsFlat.filter(entry => 
        entry.title.toLowerCase().includes(q) || 
        entry.item.toLowerCase().includes(q) ||
        entry.category.toLowerCase().includes(q)
      );

      if (matched.length === 0) {
        searchContainer.innerHTML = '<div class="skeleton">Ничего не найдено 🏎️</div>';
        return;
      }

      matched.forEach(entry => {
        const btn = document.createElement('div');
        btn.className = 'menu-btn';
        btn.innerHTML = `
          <div class="search-result-item">
            <span>${entry.title} — ${entry.item}</span>
            <span class="search-result-sub">${entry.category}</span>
          </div>
          <span class="badge">${entry.badge || 'HD'}</span>
        `;
        btn.onclick = () => {
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=${entry.code}`);
          tg.close();
        };
        searchContainer.appendChild(btn);
      });
    }

    // Экран 2: Этапы / Сезоны
    function openCategory(cat) {
      activeCategory = cat;
      cameFromSearch = false;
      const container = document.getElementById('titles-list');
      container.innerHTML = '';

      for (const t in dataTree[cat]) {
        const btn = document.createElement('div');
        btn.className = 'menu-btn';
        btn.innerHTML = `<span>${t}</span><span style="opacity:0.4;">›</span>`;
        btn.onclick = () => openDetails(t);
        container.appendChild(btn);
      }
      showView('titles');
    }

    // Экран 3: Карточка с постером и заездами
    function openDetails(titleKey) {
      const data = dataTree[activeCategory][titleKey];
      const headerBox = document.getElementById('item-header');
      const btnsBox = document.getElementById('item-btns');

      let bannerHtml = (data.image && data.image.startsWith('http')) 
        ? `<img class="gp-banner" src="${data.image}" alt="${titleKey}">` 
        : '';
      let descHtml = data.description 
        ? `<div class="gp-desc">${data.description}</div>` 
        : '';

      headerBox.innerHTML = `
        ${bannerHtml}
        <div class="gp-title">${titleKey}</div>
        ${descHtml}
      `;

      btnsBox.innerHTML = '';
      data.items.forEach(it => {
        const btn = document.createElement('div');
        btn.className = 'menu-btn';
        btn.innerHTML = `
          <span>${it.item}</span>
          <span class="badge">${it.badge || 'HD'}</span>
        `;
        btn.onclick = () => {
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=${it.code}`);
          tg.close();
        };
        btnsBox.appendChild(btn);
      });

      showView('details');
    }
  </script>
</body>
</html>
